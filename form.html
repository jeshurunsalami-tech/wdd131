<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Submit a product review and share your rating, experience, and useful product features.">
    <meta name="author" content="Jeshurun Salami">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@100;400&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&family=Roboto:ital@0;1&family=Ubuntu&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <div class="form-content">

                <label>Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>


                <label>Overall Rating</label>

                <div class="rating">
                    <label for="rating1"><span>☆</span><input type="radio" id="rating1" name="rating" value="1"
                            required></label>

                    <label for="rating2"><span>☆☆</span><input type="radio" id="rating2" name="rating" value="2"
                            required></label>

                    <label for="rating3"><span>☆☆☆</span><input type="radio" id="rating3" name="rating" value="3"
                            required></label>

                    <label for="rating4"><span>☆☆☆☆</span><input type="radio" id="rating4" name="rating" value="4"
                            required></label>

                    <label for="rating5"><span>☆☆☆☆☆</span><input type="radio" id="rating5" name="rating" value="5"
                            required></label>
                </div>


                <label for="installDate">Date of Installation<input type="date" id="installDate" name="installDate"
                        required></label>


                <label>Which features did you find useful in the product?<span class="instruction">(Check all that
                        apply)</span></label>

                <div class="features">

                    <label for="durability"><input type="checkbox" id="durability" name="features"
                            value="durability">Durability</label>

                    <label for="easeOfUse"><input type="checkbox" id="easeOfUse" name="features"
                            value="ease-of-use">Ease of Use</label>

                    <label for="performance"><input type="checkbox" id="performance" name="features"
                            value="performance">Performance</label>

                    <label for="design"><input type="checkbox" id="design" name="features" value="design">Design</label>

                </div>


                <label>Written Review <span class="optional">(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview"></textarea>

                <label for="userName">Your Name <span class="optional">(Optional)</span><input type="text" id="userName"
                        name="userName"></label>

                <input type="submit" value="Post Review">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> 🌴 Jeshurun Salami 🌴</p>
        <p>Togo</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
