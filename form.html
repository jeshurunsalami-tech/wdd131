<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form">
    <meta name="author" content="Jeshurun Salami">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@100;400&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&family=Roboto:ital@0;1&family=Ubuntu&display=swap"
        rel="stylesheet">
</head>

<body>

    <main>
        <form method="get" action="review.html">

            <h1>Product Review</h1>

            <div class="form-content">

                <label>Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Choose a Product ...</option>
                    <option value="flux capacitor">Flux Capacitor</option>
                    <option value="power laces">Power Laces</option>
                    <option value="time circuits">Time Circuits</option>
                    <option value="low voltage reactor">Low Voltage Reactor</option>
                    <option value="warp equalizer">Warp Equalizer</option>
                </select>


                <label>Overall Rating</label>

                <div class="rating">
                    <label><span>☆</span><input type="radio" id="rating1" name="rating" value="1" required></label>

                    <label><span>☆☆</span><input type="radio" id="rating2" name="rating" value="2" required></label>

                    <label><span>☆☆☆</span><input type="radio" id="rating3" name="rating" value="3" required></label>

                    <label><span>☆☆☆☆</span><input type="radio" id="rating4" name="rating" value="4" required></label>

                    <label><span>☆☆☆☆☆</span><input type="radio" id="rating5" name="rating" value="5" required></label>
                </div>


                <label>Date of Installation<input type="date" id="installDate" name="installDate" required></label>


                <label>Which features did you find useful in the product?<span class="instruction">(Check all that
                        apply)</span></label>

                <div class="features">

                    <label><input type="checkbox" id="durability" name="features" value="durability">Durability</label>

                    <label><input type="checkbox" id="easeOfUse" name="features" value="ease-of-use">Ease of Use</label>

                    <label><input type="checkbox" id="performance" name="features"
                            value="performance">Performance</label>

                    <label><input type="checkbox" id="design" name="features" value="design">Design</label>

                </div>


                <label>Written Review<span class="optional">(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview"></textarea>

                <label>Your Name<span class="optional">(Optional)</span><input type="text" id="userName"
                        name="userName"></label>

                <input type="submit" value="Post Review">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> 🌴 Jeshurun Salami 🌴</p>
        <p>Togo</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
