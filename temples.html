<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A responsive album of temples from around the world.">
    <meta name="author" content="Jeshurun Salami">

    <title>Temple Album</title>

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@100;400&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&family=Roboto:ital@0;1&family=Ubuntu&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <div class="header-content">
            <span class="site-title">Temple Album</span>

            <button id="menu-button" aria-label="Open navigation menu">
                ☰
            </button>

            <nav>
                <a href="#">Home</a>
                <a href="#">Old</a>
                <a href="#">New</a>
                <a href="#">Large</a>
                <a href="#">Small</a>
            </nav>
        </div>
    </header>

    <main>
        <h1>Home</h1>

        <div class="temple-grid">

            <figure>
                <img src="images/aba_nigeria_temple_lds.jpeg" alt="Aba Nigeria Temple Lds.">
                <figcaption>Aba Nigeria Temple Lds</figcaption>
            </figure>

            <figure>
                <img src="images/abidjan_ivory_coast_temple_exterior.jpeg" alt="Abidjan Ivory Coast Temple Exterior.">
                <figcaption>Abidjan Ivory Coast Temple Exterior</figcaption>
            </figure>

            <figure>
                <img src="images/accra_ghana_temple_lds.jpeg" alt="Accra Ghana Temple Lds.">
                <figcaption>Accra Ghana Temple Lds</figcaption>
            </figure>

            <figure>
                <img src="images/birmingham_alabama_temple.jpeg" alt="Birmingham Alabama Temple.">
                <figcaption>Birmingham Alabama Temple</figcaption>
            </figure>

            <figure>
                <img src="images/boston_massachusetts_temple.jpeg" alt="Boston Massachusetts Temple.">
                <figcaption>Boston Massachusetts Temple</figcaption>
            </figure>

            <figure>
                <img src="images/brigham_city_utah_temple_dawn.jpeg" alt="Brigham City Utah Temple Dawn.">
                <figcaption>Brigham City Utah Temple Dawn</figcaption>
            </figure>

            <figure>
                <img src="images/draper_utah_temple.jpeg" alt="Draper Utah Temple.">
                <figcaption>Draper Utah Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple_rendering_cuernavaca_mexico_temple.jpg"
                    alt="Temple Rendering Cuernavaca Mexico Temple.">
                <figcaption>Temple Rendering Cuernavaca Mexico Temple</figcaption>
            </figure>

            <figure>
                <img src="images/tokyo_japan_temple.jpg" alt="Tokyo Japan Temple.">
                <figcaption>Tokyo Japan Temple</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 🌴 Jeshurun Salami 🌴 Lomé, Togo</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
